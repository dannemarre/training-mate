[project]
name = "training-mate"
version = "0.1.0"
description = "Personal AI cycling/running coach — small CLI tools that Claude Code orchestrates."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "stravalib>=2.0",
  "garminconnect>=0.2.20",
  "garth>=0.5",
  "fitparse>=1.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "polyline>=2.0",
  "tenacity>=8.3",
  "platformdirs>=4.2",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-mock>=3.14",
  "freezegun>=1.5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
